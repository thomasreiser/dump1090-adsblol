syntax = "proto3";

package adsb.v2;

import "google/api/annotations.proto";

option go_package = "github.com/adsblol/dump1090-adsblol/gen/adsb/v2;adsbv2";

// AdsbService is the dump1090-backed, adsb.lol-compatible /v2 read API
service AdsbService {
  // GET /v2/hex/{hex_list} — comma-separated 24-bit ICAO hex codes
  rpc GetByHex(HexRequest) returns (V2Response) {
    option (google.api.http) = { get: "/v2/hex/{hex_list}" };
  }

  // GET /v2/callsign/{callsign_list} — comma-separated callsigns
  rpc GetByCallsign(CallsignRequest) returns (V2Response) {
    option (google.api.http) = { get: "/v2/callsign/{callsign_list}" };
  }

  // GET /v2/reg/{reg_list} — comma-separated registrations
  rpc GetByRegistration(RegistrationRequest) returns (V2Response) {
    option (google.api.http) = { get: "/v2/reg/{reg_list}" };
  }

  // GET /v2/icao/{type_list} (alias /v2/type/{type_list}) — ICAO type designators (e.g. A320)
  rpc GetByIcaoType(IcaoTypeRequest) returns (V2Response) {
    option (google.api.http) = {
      get: "/v2/icao/{type_list}"
      additional_bindings { get: "/v2/type/{type_list}" }
    };
  }

  // GET /v2/squawk/{squawk} — one 4-digit Mode A code
  rpc GetBySquawk(SquawkRequest) returns (V2Response) {
    option (google.api.http) = { get: "/v2/squawk/{squawk}" };
  }

  // GET /v2/mil — aircraft flagged military
  rpc GetMilitary(EmptyRequest) returns (V2Response) {
    option (google.api.http) = { get: "/v2/mil" };
  }

  // GET /v2/ladd — Limiting Aircraft Data Displayed list
  rpc GetLadd(EmptyRequest) returns (V2Response) {
    option (google.api.http) = { get: "/v2/ladd" };
  }

  // GET /v2/pia — Privacy ICAO Address aircraft (hex starts with ADF)
  rpc GetPia(EmptyRequest) returns (V2Response) {
    option (google.api.http) = { get: "/v2/pia" };
  }

  // GET /v2/lat/{lat}/lon/{lon}/dist/{dist} — aircraft within `dist` NM of (lat, lon)
  rpc GetWithinRadius(RadiusRequest) returns (V2Response) {
    option (google.api.http) = { get: "/v2/lat/{lat}/lon/{lon}/dist/{dist}" };
  }

  // GET /v2/closest/{lat}/{lon}/{dist} — single closest aircraft within `dist` NM
  rpc GetClosest(RadiusRequest) returns (V2Response) {
    option (google.api.http) = { get: "/v2/closest/{lat}/{lon}/{dist}" };
  }
}

message EmptyRequest {}

message HexRequest {
  string hex_list = 1;
}

message CallsignRequest {
  string callsign_list = 1;
}

message RegistrationRequest {
  string reg_list = 1;
}

message IcaoTypeRequest {
  string type_list = 1;
}

message SquawkRequest {
  string squawk = 1;
}

message RadiusRequest {
  double lat = 1;
  double lon = 2;
  double dist = 3;
}

// V2Response mirrors the adsb.lol /v2 response envelope. Timestamps are doubles
// (not int64) so protojson emits JSON numbers instead of the canonical strings
message V2Response {
  repeated Aircraft ac = 1;
  string msg = 2;
  // server clock, unix-epoch milliseconds
  double now = 3;
  // number of aircraft in `ac`
  int32 total = 4;
  // server clock again, kept for parity with adsb.lol
  double ctime = 5;
  // processing time in milliseconds
  double ptime = 6;
}

// Aircraft is a snapshot of a tracked target. Anything not derivable from SBS
// is omitted by the gateway
message Aircraft {
  // 24-bit ICAO hex, lowercase
  string hex = 1;
  // origin type: "adsb_icao", "adsb_icao_nt", "mlat", "tisb", ...
  string type = 2;
  // callsign / flight number, padded to 8 chars on the wire — kept as-received
  string flight = 3;
  // registration, from the optional aircraft DB
  string r = 4;
  // ICAO type designator, from the optional aircraft DB
  string t = 5;
  // barometric altitude in feet. 0 when `ground` is true. adsb.lol serialises
  // "ground" as a string here; we keep it numeric for proto-friendliness
  int32 alt_baro = 6;
  bool ground = 7;
  // ground speed in knots
  double gs = 8;
  // true track over ground in degrees
  double track = 9;
  // barometric vertical rate, ft/min
  int32 baro_rate = 10;
  // Mode A squawk, 4 octal digits
  string squawk = 11;
  // emergency state: "none", "general", "lifeguard", ...
  string emergency = 12;
  // aircraft category (A0..A7, B0..B7, ...)
  string category = 13;
  double lat = 14;
  double lon = 15;
  // seconds since the last position update
  double seen_pos = 16;
  // seconds since any message from this aircraft
  double seen = 17;
  // total SBS messages received for this hex since the tracker first heard it.
  // Encoded as double so protojson emits a number (int64 would be a string)
  double messages = 18;
  int32 alert = 19;
  int32 spi = 20;
  // distance from the query point in nautical miles. Only populated by
  // /v2/lat/lon/dist and /v2/closest
  double dst = 21;
}
