syntax = "proto3";

package adsb.v2;

import "google/api/annotations.proto";

option go_package = "github.com/adsblol/dump1090-adsblol/gen/adsb/v2;adsbv2";

// AdsbService exposes the dump1090-backed adsb.lol-compatible /v2 read API.
service AdsbService {
  // /v2/hex/{hex_list} — one or more comma-separated 24-bit ICAO hexes.
  rpc GetByHex(HexRequest) returns (V2Response) {
    option (google.api.http) = { get: "/v2/hex/{hex_list}" };
  }

  // /v2/callsign/{callsign_list} — comma-separated callsigns.
  rpc GetByCallsign(CallsignRequest) returns (V2Response) {
    option (google.api.http) = { get: "/v2/callsign/{callsign_list}" };
  }

  // /v2/reg/{reg_list} — comma-separated registrations.
  rpc GetByRegistration(RegistrationRequest) returns (V2Response) {
    option (google.api.http) = { get: "/v2/reg/{reg_list}" };
  }

  // /v2/icao/{type_list} — comma-separated ICAO aircraft type designators (e.g. A320).
  rpc GetByIcaoType(IcaoTypeRequest) returns (V2Response) {
    option (google.api.http) = {
      get: "/v2/icao/{type_list}"
      additional_bindings { get: "/v2/type/{type_list}" }
    };
  }

  // /v2/squawk/{squawk} — single 4-digit Mode A squawk code.
  rpc GetBySquawk(SquawkRequest) returns (V2Response) {
    option (google.api.http) = { get: "/v2/squawk/{squawk}" };
  }

  // /v2/mil — all currently-tracked aircraft flagged military.
  rpc GetMilitary(EmptyRequest) returns (V2Response) {
    option (google.api.http) = { get: "/v2/mil" };
  }

  // /v2/ladd — Limiting Aircraft Data Displayed list.
  rpc GetLadd(EmptyRequest) returns (V2Response) {
    option (google.api.http) = { get: "/v2/ladd" };
  }

  // /v2/pia — Privacy ICAO Address aircraft (hex starting with ADF).
  rpc GetPia(EmptyRequest) returns (V2Response) {
    option (google.api.http) = { get: "/v2/pia" };
  }

  // /v2/lat/{lat}/lon/{lon}/dist/{dist} — aircraft within `dist` nautical miles of (lat, lon).
  rpc GetWithinRadius(RadiusRequest) returns (V2Response) {
    option (google.api.http) = { get: "/v2/lat/{lat}/lon/{lon}/dist/{dist}" };
  }

  // /v2/closest/{lat}/{lon}/{dist} — single closest aircraft within `dist` nautical miles.
  rpc GetClosest(RadiusRequest) returns (V2Response) {
    option (google.api.http) = { get: "/v2/closest/{lat}/{lon}/{dist}" };
  }
}

message EmptyRequest {}

message HexRequest {
  string hex_list = 1;
}

message CallsignRequest {
  string callsign_list = 1;
}

message RegistrationRequest {
  string reg_list = 1;
}

message IcaoTypeRequest {
  string type_list = 1;
}

message SquawkRequest {
  string squawk = 1;
}

message RadiusRequest {
  double lat = 1;
  double lon = 2;
  double dist = 3;
}

// V2Response mirrors the adsb.lol /v2 response envelope. Timestamps are
// emitted as doubles (not int64) so they serialize as JSON numbers rather
// than the canonical-protojson string form, matching adsb.lol's wire format.
message V2Response {
  repeated Aircraft ac = 1;
  string msg = 2;
  // Server clock in unix-epoch milliseconds.
  double now = 3;
  // Number of aircraft in `ac`.
  int32 total = 4;
  // Server clock in unix-epoch milliseconds (legacy duplicate of `now`).
  double ctime = 5;
  // Processing time in milliseconds.
  double ptime = 6;
}

// Aircraft is a snapshot of a tracked target. Fields that we cannot derive from
// SBS BaseStation data are omitted (the JSON gateway uses emit_unpopulated=false
// for optional scalars so absent fields simply don't appear).
message Aircraft {
  // 24-bit ICAO hex, lowercase.
  string hex = 1;
  // Origin type: "adsb_icao", "adsb_icao_nt", "mlat", "tisb", ...
  string type = 2;
  // Callsign / flight number, padded to 8 chars on the wire — kept as-received.
  string flight = 3;
  // Registration (looked up from optional aircraft DB).
  string r = 4;
  // ICAO type designator (looked up from optional aircraft DB).
  string t = 5;
  // Barometric altitude in feet. When the aircraft is on the ground, this is
  // 0 and `ground` is true (the upstream adsb.lol serializes "ground" as a
  // string here; we keep it numeric for proto-friendliness).
  int32 alt_baro = 6;
  bool ground = 7;
  // Ground speed in knots.
  double gs = 8;
  // True track over ground in degrees.
  double track = 9;
  // Barometric vertical rate in ft/min.
  int32 baro_rate = 10;
  // Mode A squawk code as 4 octal digits.
  string squawk = 11;
  // Emergency state: "none", "general", "lifeguard", ...
  string emergency = 12;
  // Aircraft category (A0..A7, B0..B7, ...).
  string category = 13;
  double lat = 14;
  double lon = 15;
  // Seconds since the last position update.
  double seen_pos = 16;
  // Seconds since any message from this aircraft.
  double seen = 17;
  // Total SBS messages received from this hex during its lifetime in the tracker.
  // Encoded as double for JSON compatibility with adsb.lol (it returns a number,
  // and int64 in canonical protojson would be a string).
  double messages = 18;
  int32 alert = 19;
  int32 spi = 20;
  // Distance from a query point, in nautical miles. Populated only for the
  // /v2/lat/lon/radius and /v2/closest endpoints.
  double dst = 21;
}
